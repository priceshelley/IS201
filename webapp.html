<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe vs AI</title>
  <style>
    body {
      font-family: sans-serif;
      text-align: center;
      margin-top: 50px;
      background: #f4f4f8;
    }
    #game {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }
    .cell {
      width: 100px;
      height: 100px;
      font-size: 2.5rem;
      background: white;
      border: 2px solid #555;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .cell:hover {
      background: #dff9fb;
    }
    #status {
      margin: 20px;
      font-size: 1.2rem;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      background: #27ae60;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #219150;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe: You vs AI</h1>
  <div id="game"></div>
  <div id="status">Your turn (X)</div>
  <button onclick="resetGame()">Restart</button>

  <script>
    const game = document.getElementById("game");
    const statusText = document.getElementById("status");
    let board = Array(9).fill(null);
    let gameActive = true;
    const human = "X";
    const ai = "O";

    function checkWinner() {
      const winPatterns = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];
      for (let [a,b,c] of winPatterns) {
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          return board[a];
        }
      }
      return board.includes(null) ? null : "draw";
    }

    function aiMove() {
      if (!gameActive) return;

      const emptyIndices = board
        .map((val, idx) => val === null ? idx : null)
        .filter(idx => idx !== null);

      if (emptyIndices.length === 0) return;

      const choice = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      board[choice] = ai;
      render();

      const result = checkWinner();
      if (result) {
        endGame(result);
      } else {
        statusText.textContent = "Your turn (X)";
      }
    }

    function handleClick(i) {
      if (!gameActive || board[i]) return;
      board[i] = human;
      render();

      const result = checkWinner();
      if (result) {
        endGame(result);
      } else {
        statusText.textContent = "AI thinking...";
        setTimeout(aiMove, 500); // brief pause before AI moves
      }
    }

    function render() {
      game.innerHTML = "";
      board.forEach((val, i) => {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.textContent = val || "";
        cell.addEventListener("click", () => handleClick(i));
        game.appendChild(cell);
      });
    }

    function endGame(result) {
      gameActive = false;
      if (result === "draw") {
        statusText.textContent = "It's a draw!";
      } else {
        statusText.textContent = result === human ? "You win!" : "AI wins!";
      }
    }

    function resetGame() {
      board = Array(9).fill(null);
      gameActive = true;
      statusText.textContent = "Your turn (X)";
      render();
    }

    render();
  </script>
</body>
</html>
